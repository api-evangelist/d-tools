          - string
          - 'null'
        isLengthBased:
          type: boolean
        lengthName:
          type:
          - string
          - 'null'
        length:
          type:
          - integer
          - 'null'
          format: int32
        msrp:
          type:
          - number
          - 'null'
          format: double
        unitCost:
          type:
          - number
          - 'null'
          format: double
        unitPrice:
          type:
          - number
          - 'null'
          format: double
        margin:
          type:
          - number
          - 'null'
          format: double
        markup:
          type:
          - number
          - 'null'
          format: double
        costPerLength:
          type:
          - number
          - 'null'
          format: double
        pricePerLength:
          type:
          - number
          - 'null'
          format: double
        isTaxable:
          type: boolean
        tax:
          type:
          - string
          - 'null'
        supplier:
          type:
          - string
          - 'null'
        system:
          type:
          - string
          - 'null'
        phase:
          type:
          - string
          - 'null'
        upcBarcode:
          type:
          - string
          - 'null'
        eanBarcode:
          type:
          - string
          - 'null'
        itfBarcode:
          type:
          - string
          - 'null'
        isStockItem:
          type: boolean
        quantityOnHand:
          type:
          - integer
          - 'null'
          format: int32
        quantityAllocated:
