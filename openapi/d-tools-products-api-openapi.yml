          - integer
          - 'null'
          format: int32
        quantityOnOrder:
          type:
          - integer
          - 'null'
          format: int32
        quantityNeeded:
          type:
          - integer
          - 'null'
          format: int32
        minimumStockLevel:
          type:
          - integer
          - 'null'
          format: int32
        reorderLevel:
          type:
          - integer
          - 'null'
          format: int32
        isDiscontinued:
          type: boolean
        isClientSupplied:
