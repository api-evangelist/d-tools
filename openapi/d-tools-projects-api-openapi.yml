          type: array
          items:
            type: string
      - name: stages
        in: query
        schema:
          type: array
          items:
            type: string
      - name: priorities
        in: query
        schema:
          type: array
          items:
            type: string
      - name: projectManagers
        in: query
        schema:
          type: array
          items:
            type: string
      - name: fromCompletedDate
        in: query
        schema:
          type: string
          format: date-time
      - name: toCompletedDate
        in: query
        schema:
          type: string
          format: date-time
      - name: fromCreatedDate
        in: query
        schema:
          type: string
          format: date-time
      - name: toCreatedDate
        in: query
        schema:
          type: string
          format: date-time
      - name: fromModifiedDate
        in: query
