            text/json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
        '500':
          description: Internal Server Error
  /api/v1/ServiceContracts/GetServiceContract:
    get:
      tags:
      - ServiceContracts
      parameters:
      - name: id
        in: query
        schema:
          type: string
          format: uuid
      responses:
