          type: string
          format: date-time
      - name: fromEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: toEndDate
        in: query
        schema:
          type: string
          format: date-time
      - name: fromPaymentDueDate
        in: query
        schema:
          type: string
          format: date-time
      - name: toPaymentDueDate
        in: query
        schema:
          type: string
          format: date-time
