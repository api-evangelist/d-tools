- No operationIds, so no entity-to-operation binding can be derived by name.
- No id-reference fields are typed or documented; cross-entity joins are inferred by a consumer, not declared.
- Cloud and SI model the same domain twice with different schema names and no shared identifier space; an integration
  spanning both products must maintain its own mapping table.
