response_headers:
  published: []
  note: >-
    D-Tools publishes NO rate-limit response headers. There is no X-RateLimit-*, no RateLimit-*, and no
    Retry-After documented, and no 429 response is declared on any of the 26 Cloud operations in the OpenAPI. The
    numbers above exist only as prose in a help-center article, which means a client cannot discover its remaining
    budget at runtime and cannot learn when it may retry — it can only count its own calls and guess. This is the
    highest-value runtime fix available on this API: emit RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset
    and a 429 with Retry-After, and declare the 429 in the spec.
