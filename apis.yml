aid: d-tools
name: D-Tools
description: >-
  D-Tools Inc. builds estimation, system design, project management and field-service software for audio-visual,
  low-voltage, security and systems-integration contractors. Two products carry two distinct public APIs. D-Tools
  Cloud is the web-native platform, and its REST API (dtcloudapi.d-tools.cloud) exposes Clients, Products,
  Opportunities, Quotes, Projects, Change Orders, Purchase Orders, Service Contracts, Files and Time Entries with
  documented rate limits, webhooks and a downloadable Postman collection. D-Tools System Integrator (SI) is the
  on-premises/hosted Windows product; because SI itself has no directly reachable API, D-Tools operates a cloud
  middleware queue at api.d-tools.com/si where third parties publish projects, change orders, tasks, service orders,
  purchase orders, time sheets, product catalogs, clients and vendors to an SI user and subscribe to what that SI
  user exports. Both APIs publish machine-readable specifications: OpenAPI 3.1.1 for SI and OpenAPI 3.0.4 for Cloud.
