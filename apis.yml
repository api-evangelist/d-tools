apis:
- name: D-Tools Cloud API
  description: >-
    REST API for the D-Tools Cloud platform. Read, create and update Clients, Products, Opportunities, Quotes,
    Projects, Change Orders, Purchase Orders, Service Contracts, Files and Time Entries. Requests carry two
    credentials at once — a fixed HTTP Basic value that D-Tools publishes in its own documentation, plus a
    tenant-specific X-API-Key generated in-app under Settings > Integration > Developer. Limits are 120 calls per
    minute and 10,000 calls per day per API key, and list endpoints are paginated.
  humanURL: https://dtcloudapi.d-tools.cloud/apidocs/index.html
  baseURL: https://dtcloudapi.d-tools.cloud
