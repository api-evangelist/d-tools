- name: D-Tools System Integrator (SI) API
  description: >-
    Cloud middleware API that bridges the on-premises or hosted D-Tools System Integrator application to third-party
    systems. It is a queue, not a live database: publishers POST projects, change orders, tasks, service orders,
    time sheets, product catalogs, clients and vendors into the queue for an SI user to apply, and subscribers GET
    what an SI user has exported, then mark each message imported. Authentication is a per-user, per-integration API
    key passed in the X-DTSI-ApiKey header and generated in the SI Control Panel under Manage Integrations.
  humanURL: https://api.d-tools.com/si/doc
  baseURL: https://api.d-tools.com/si
